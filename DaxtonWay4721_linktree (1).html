<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daxton Tessmer | Links</title>
  <meta name="description" content="A mobile-first link hub for Daxton Tessmer's portfolio, contact information, process, and work.">
  <style>
    :root{
      color-scheme:dark;
      --paper:#f3eee4;
      --ink:#11130f;
      --muted:#bfb8a8;
      --gold:#c9a227;
      --green:#355d41;
      --line:rgba(243,238,228,.22);
      --panel:rgba(17,19,15,.74);
      --shadow:0 22px 70px rgba(0,0,0,.36);
    }
    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }
    body{
      margin:0;
      min-height:100svh;
      display:flex;
      justify-content:center;
      padding:18px;
      background:
        radial-gradient(circle at 18% 0%, rgba(201,162,39,.24), transparent 28%),
        radial-gradient(circle at 92% 22%, rgba(53,93,65,.42), transparent 34%),
        linear-gradient(180deg, #10130f 0%, #181914 48%, #070806 100%);
      color:var(--paper);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main{
      width:min(100%, 440px);
      min-height:calc(100svh - 36px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:18px;
    }
    .card{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadow);
      padding:24px 18px 18px;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:-40% -20% auto;
      height:260px;
      background:radial-gradient(circle, rgba(243,238,228,.13), transparent 58%);
      pointer-events:none;
    }
    .identity{
      position:relative;
      display:grid;
      justify-items:center;
      text-align:center;
      gap:12px;
      padding-bottom:10px;
    }
    .mark{
      width:164px;
      height:164px;
      display:grid;
      place-items:center;
      border:1px solid rgba(243,238,228,.42);
      background:
        linear-gradient(135deg, rgba(201,162,39,.22), transparent 55%),
        #151812;
      font-family:Georgia, serif;
      font-size:4.2rem;
      font-weight:600;
      letter-spacing:-.08em;
    }
    h1{
      margin:4px 0 0;
      font-family:Georgia, "Times New Roman", serif;
      font-size:clamp(2rem, 11vw, 3.4rem);
      line-height:.92;
      letter-spacing:-.03em;
    }
    .tagline{
      margin:0;
      max-width:32ch;
      color:var(--muted);
      font-size:.98rem;
      line-height:1.55;
    }
    .contact{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
      gap:6px 10px;
      margin-top:2px;
      color:#dcd5c5;
      font-size:.82rem;
      line-height:1.35;
      letter-spacing:.02em;
    }
    .contact a{
      color:var(--gold);
      text-decoration:none;
      border-bottom:1px solid rgba(201,162,39,.45);
    }
    .contact a:hover,
    .contact a:focus-visible{
      outline:none;
      color:#f3d777;
      border-bottom-color:#f3d777;
    }
    nav{
      position:relative;
      display:grid;
      gap:10px;
      margin-top:16px;
    }
    .link{
      min-height:58px;
      display:grid;
      grid-template-columns:34px 1fr auto;
      align-items:center;
      gap:12px;
      padding:12px 13px;
      border:1px solid rgba(243,238,228,.18);
      background:rgba(243,238,228,.07);
      color:var(--paper);
      text-decoration:none;
      transition:transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .link:active{ transform:scale(.985); }
    .link:hover,
    .link:focus-visible{
      outline:none;
      transform:translateY(-2px);
      border-color:rgba(201,162,39,.72);
      background:rgba(201,162,39,.12);
    }
    .icon{
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border:1px solid rgba(243,238,228,.16);
      background:rgba(0,0,0,.18);
      color:var(--gold);
      font-size:1rem;
    }
    .copy strong{
      display:block;
      font-size:.98rem;
      line-height:1.18;
    }
    .copy span{
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-size:.78rem;
      line-height:1.35;
    }
    .arrow{
      color:var(--gold);
      font-size:1.1rem;
    }
    .section-label{
      margin:14px 2px 2px;
      color:#8d8678;
      font-size:.68rem;
      letter-spacing:.16em;
      text-transform:uppercase;
    }
    .note{
      margin:14px 0 0;
      padding-top:14px;
      border-top:1px solid rgba(243,238,228,.12);
      color:#978f80;
      font-size:.75rem;
      line-height:1.45;
      text-align:center;
    }
    .close-home{
      position:fixed;
      top:14px;
      right:14px;
      z-index:20;
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border:1px solid rgba(243,238,228,.42);
      background:rgba(8,10,8,.62);
      color:#f3eee4;
      font-size:1.45rem;
      line-height:1;
      text-decoration:none;
      backdrop-filter:blur(14px);
      transition:transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .close-home:hover,
    .close-home:focus-visible{
      outline:none;
      transform:translateY(-2px);
      border-color:var(--gold);
      background:rgba(16,18,14,.84);
    }
    @media (min-width:720px){
      body{ padding:34px; }
      main{ width:min(100%, 500px); }
      .card{ padding:30px 24px 22px; }
    }
  </style>
</head>
<body>
  <a class="close-home" href="index.html" aria-label="Return to portfolio landing page">×</a>
  <main>
    <section class="card" aria-label="Daxton Tessmer link hub">
      <header class="identity">
        <div class="mark" aria-hidden="true">DT</div>
        <p class="tagline">A quick doorway into my portfolio</p>
        <div class="contact" aria-label="Contact information">
          <span>dtessmer@uark.edu</span>
          <span>760 462 5968</span>
          <a href="https://www.linkedin.com/in/daxton-tessmer-0b258332a/?lipi=urn%3Ali%3Apage%3Ad_flagship3_profile_view_base_contact_details%3BOmOgedhVRWiWzq%2FoslpgxQ%3D%3D" target="_blank" rel="noopener">LinkedIn</a>
        </div>
      </header>

      <nav aria-label="Portfolio links">
        <a class="link" href="index.html">
          <span class="icon" aria-hidden="true">01</span>
          <span class="copy"><strong>Portfolio Start to Finish</strong></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <a class="link" href="index.html#workTopoPage">
          <span class="icon" aria-hidden="true">02</span>
          <span class="copy"><strong>Work Experience</strong></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <a class="link" href="index.html#storiesCover">
          <span class="icon" aria-hidden="true">03</span>
          <span class="copy"><strong>LinkedIn Stories</strong></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <a class="link" href="index.html#traitsSection">
          <span class="icon" aria-hidden="true">04</span>
          <span class="copy"><strong>Who is Daxton</strong></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
